apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: splitly
spec:
  replicas: 1
  # Recreate : l'ancien pod s'arrete AVANT que le nouveau demarre.
  # Deux PostgreSQL sur le meme dossier de donnees, meme quelques secondes, peuvent le corrompre.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          # Utilisateur et mot de passe : dans le Secret postgres-secret, jamais dans ce fichier.
          envFrom:
            - secretRef:
                name: postgres-secret
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\""]
          volumeMounts:
            - mountPath: /var/lib/postgresql/data
              name: postgredb
            - mountPath: /docker-entrypoint-initdb.d
              name: init
      volumes:
        - name: postgredb
          persistentVolumeClaim:
            claimName: postgres-pv-claim
        - name: init
          configMap:
            name: postgres-init
