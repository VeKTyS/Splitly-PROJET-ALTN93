apiVersion: apps/v1
kind: Deployment
metadata:
  name: expense-service
  namespace: splitly
spec:
  replicas: 1
  selector:
    matchLabels:
      app: expense-service
  template:
    metadata:
      labels:
        app: expense-service
    spec:
      containers:
        - name: expense-service
          image: vektys/splitly-expense-service:1.0.0
          ports:
            - containerPort: 8081
          env:
            # Le lien entre les services : le nom du Service de group-service, resolu par le DNS du cluster.
            - name: GROUP_SERVICE_URL
              value: http://group-service:8080
          # Le pod ne recoit du trafic que quand /health repond.
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
          # Si /health ne repond plus, Kubernetes redemarre le conteneur.
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
