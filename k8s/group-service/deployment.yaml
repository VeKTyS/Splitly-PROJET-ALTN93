apiVersion: apps/v1
kind: Deployment
metadata:
  name: group-service
  namespace: splitly
spec:
  replicas: 1
  selector:
    matchLabels:
      app: group-service
  template:
    metadata:
      labels:
        app: group-service
    spec:
      containers:
        - name: group-service
          image: vektys/splitly-group-service:1.0.0
          ports:
            - containerPort: 8080
          # Le pod ne recoit du trafic que quand /health repond.
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
          # Si /health ne repond plus, Kubernetes redemarre le conteneur.
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
