apiVersion: apps/v1
kind: Deployment
metadata:
  name: group-service
  namespace: splitly
spec:
  replicas: 1
  selector:
    matchLabels:
      app: group-service
  template:
    metadata:
      labels:
        app: group-service
    spec:
      containers:
        - name: group-service
          image: vektys/splitly-group-service:1.1.0
          ports:
            - containerPort: 8080
          env:
            # Identifiants lus dans le Secret, puis assembles dans l'URL : $(VAR) reprend une variable definie au-dessus.
            - name: DB_USER
              valueFrom:
                secretKeyRef: { name: postgres-secret, key: POSTGRES_USER }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: postgres-secret, key: POSTGRES_PASSWORD }
            - name: DATABASE_URL
              value: postgres://$(DB_USER):$(DB_PASSWORD)@postgres:5432/groups_db
          # Le pod ne recoit du trafic que quand /health repond.
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
          # Si /health ne repond plus, Kubernetes redemarre le conteneur.
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
