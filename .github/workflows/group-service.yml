# Contrôles de group-service : tests et qualité en parallèle, puis image Docker si les deux passent.
name: group-service

on:
  pull_request:
  push:
    branches: [main]

# Permissions minimales : lire le code suffit, rien n'est écrit sur GitHub.
permissions:
  contents: read

# Un nouveau push sur une PR annule le run précédent, devenu obsolète.
# Sur main, on n'annule jamais : un run interrompu pourrait laisser une image à moitié publiée.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: vektys/splitly-group-service

jobs:
  tests:
    name: Group tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend/group-service
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/group-service/package-lock.json
      - run: npm ci
      - run: npm test

  quality:
    name: Group quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend/group-service
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/group-service/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck

  image:
    name: Group Docker image
    needs: [tests, quality]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # Connexion et publication uniquement sur un push vers main, jamais depuis une PR.
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: backend/group-service
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
