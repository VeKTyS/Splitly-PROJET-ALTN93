# Contrôles de group-service : tests et qualité en parallèle, puis image Docker si les deux passent.
name: group-service

on:
  pull_request:
  push:
    branches: [main]

# Permissions minimales : lire le code suffit, rien n'est écrit sur GitHub.
permissions:
  contents: read

# Un nouveau push sur une PR annule le run précédent, devenu obsolète.
# Sur main, on n'annule jamais : un run interrompu pourrait laisser une image à moitié publiée.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: vektys/splitly-group-service

jobs:
  tests:
    name: Group tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend/group-service
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/group-service/package-lock.json
      - run: npm ci
      # Deux reporters : le log reste lisible, et un rapport JUnit est écrit pour l'artefact.
      - run: npm test -- --reporter=default --reporter=junit --outputFile.junit=reports/junit.xml
      # if: always() : le rapport est téléversé même (surtout) quand les tests échouent.
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: group-tests-report
          path: backend/group-service/reports/
          retention-days: 7

  quality:
    name: Group quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend/group-service
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/group-service/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      # Rapport oxlint au format Checkstyle (XML), produit même si une étape précédente a échoué.
      - if: always()
        run: mkdir -p reports && npx oxlint --format=checkstyle > reports/oxlint-checkstyle.xml || true
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: group-quality-report
          path: backend/group-service/reports/
          retention-days: 7

  image:
    name: Group Docker image
    needs: [tests, quality]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Digest produit par Buildx, transmis au job supply chain.
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Connexion et publication uniquement sur un push vers main, jamais depuis une PR.
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend/group-service
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
      # SBOM de l'image publiée, sur le digest renvoye par Buildx (jamais sur un tag).
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: anchore/sbom-action@dfcb83b97731532d72be422cbc51ee64adb6fd56 # v0.24.4
        with:
          image: docker.io/vektys/splitly-group-service@${{ steps.build.outputs.digest }}
          format: spdx-json
          artifact-name: group-service.spdx.json
          upload-artifact-retention: 7

  supply-chain:
    name: Group supply chain
    needs: image
    # Seulement après une vraie publication : sur une PR, aucune image n'est poussée.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Un bloc permissions de job remplace celui du workflow : contents: read est répété.
    permissions:
      contents: read
      id-token: write # jeton OIDC du workflow : identité pour Cosign et actions/attest
      attestations: write # enregistrer les attestations côté GitHub
      security-events: write # téléverser le rapport SARIF de Trivy
    env:
      IMAGE_NAME: docker.io/vektys/splitly-group-service
      DIGEST: ${{ needs.image.outputs.digest }}
    steps:
      - uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4
      # Docker Hub stocke la signature et les attestations à côté de l'image.
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # Signature sans clé : certificat éphémère lié à l'identité OIDC du workflow, aucun secret de signature.
      - run: cosign sign --yes "$IMAGE_NAME@$DIGEST"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: group-service.spdx.json
      # Sans sbom-path ni prédicat, actions/attest produit une provenance SLSA du build.
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ env.DIGEST }}
          push-to-registry: true
          create-storage-record: false
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ env.DIGEST }}
          sbom-path: group-service.spdx.json
          push-to-registry: true
          create-storage-record: false
      # Le workflow vérifie sa propre sortie avant de scanner : signature et attestations de ce digest précis.
      - env:
          CERT_IDENTITY: ${{ github.server_url }}/${{ github.workflow_ref }}
        run: |
          cosign verify \
            --certificate-identity "$CERT_IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$IMAGE_NAME@$DIGEST"
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify "oci://$IMAGE_NAME@$DIGEST" --repo "${{ github.repository }}"
          gh attestation verify "oci://$IMAGE_NAME@$DIGEST" --repo "${{ github.repository }}" \
            --predicate-type https://spdx.dev/Document/v2.3
      # Scan du même digest que celui signé et attesté, jamais d'un tag.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}@${{ env.DIGEST }}
          format: sarif
          output: trivy-group-service.sarif
      - uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          sarif_file: trivy-group-service.sarif
          category: group-service
