# Contrôles d'expense-service : tests et qualité en parallèle, puis image Docker si les deux passent.
name: expense-service

on:
  pull_request:
  push:
    branches: [main]

# Permissions minimales : lire le code suffit, rien n'est écrit sur GitHub.
permissions:
  contents: read

# Un nouveau push sur une PR annule le run précédent, devenu obsolète.
# Sur main, on n'annule jamais : un run interrompu pourrait laisser une image à moitié publiée.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: vektys/splitly-expense-service

jobs:
  tests:
    name: Expense tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend/expense-service
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/expense-service/package-lock.json
      - run: npm ci
      # Deux reporters : le log reste lisible, et un rapport JUnit est écrit pour l'artefact.
      - run: npm test -- --reporter=default --reporter=junit --outputFile.junit=reports/junit.xml
      # if: always() : le rapport est téléversé même (surtout) quand les tests échouent.
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: expense-tests-report
          path: backend/expense-service/reports/
          retention-days: 7

  quality:
    name: Expense quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend/expense-service
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/expense-service/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      # Rapport oxlint au format Checkstyle (XML), produit même si une étape précédente a échoué.
      - if: always()
        run: mkdir -p reports && npx oxlint --format=checkstyle > reports/oxlint-checkstyle.xml || true
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: expense-quality-report
          path: backend/expense-service/reports/
          retention-days: 7

  image:
    name: Expense Docker image
    needs: [tests, quality]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # Connexion et publication uniquement sur un push vers main, jamais depuis une PR.
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: backend/expense-service
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
